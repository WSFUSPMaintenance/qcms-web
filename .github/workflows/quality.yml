name: QCMS Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Run QCMS tests
        run: node --test tests/*.test.js
      - name: Verify deterministic production schedule
        run: |
          node tools/generate-schedule.mjs
          git diff --exit-code -- deployment/initial-inspection-schedule.csv
      - name: Verify sanitized snapshot contract
        run: |
          node tools/sanitize-snapshots.mjs
          git diff --exit-code -- data/inspection-records.json data/inspection-responses.json
      - name: Verify no inline event handlers
        shell: bash
        run: '! grep -RniE "on(click|change|input|submit)=" --include="*.html" --include="*.js" .'
