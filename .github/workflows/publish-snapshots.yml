name: Publish QCMS snapshots

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: qcms-snapshot-publisher
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: qcms-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read SharePoint and build coordinated snapshots
        env:
          QCMS_TENANT_ID: ${{ vars.QCMS_TENANT_ID }}
          QCMS_CLIENT_ID: ${{ vars.QCMS_CLIENT_ID }}
          QCMS_SITE_URL: https://waynefarms.sharepoint.com/teams/USPQAComplianceManagementSystem
        run: node tools/publish-snapshots.mjs
      - name: Validate sanitized snapshot contract
        run: node --test tests/*.test.js
      - name: Commit both snapshots together
        shell: bash
        run: |
          if git diff --quiet -- data/inspection-records.json data/inspection-responses.json; then
            echo "No snapshot changes detected."
            exit 0
          fi
          git config user.name "qcms-snapshot-publisher[bot]"
          git config user.email "qcms-snapshot-publisher[bot]@users.noreply.github.com"
          git add data/inspection-records.json data/inspection-responses.json
          git commit -m "Refresh QCMS dashboard snapshots"
          git push origin HEAD:main
