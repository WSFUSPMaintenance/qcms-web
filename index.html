<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCMS - QA Compliance Management System</title>
    <link rel="stylesheet" href="styles.css">

    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }

        .dashboard-card {
            background: linear-gradient(145deg, #111827, #1e293b);
            border: 1px solid #475569;
            border-radius: 16px;
            padding: 24px 18px;
            text-align: center;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.35);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform .2s, border-color .2s, box-shadow .2s;
        }

        .dashboard-card:hover {
            transform: translateY(-4px);
            border-color: #93c5fd;
            box-shadow: 0 16px 32px rgba(37, 99, 235, 0.25);
        }

        .dashboard-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            height: 6px;
            width: 100%;
            background: #2563eb;
        }

        .dashboard-card:nth-child(2)::before { background: #f97316; }
        .dashboard-card:nth-child(3)::before { background: #22c55e; }
        .dashboard-card:nth-child(4)::before { background: #ef4444; }
        .dashboard-card:nth-child(5)::before { background: #eab308; }
        .dashboard-card:nth-child(6)::before { background: #dc2626; }
        .dashboard-card:nth-child(7)::before { background: #14b8a6; }
        .dashboard-card:nth-child(8)::before { background: #8b5cf6; }

        .dashboard-number {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .dashboard-label {
            color: #cbd5e1;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: .6px;
        }
    </style>
</head>
<body>

<header>
    <h1>QA Compliance Management System</h1>
    <p>Wayne Sanderson Farms - Union Springs</p>
</header>

<main>

    <div id="homePanel">

        <div class="dashboard-grid">

            <button class="dashboard-card" data-tone="blue" onclick="showInspectionQueue('open')">
                <div class="dashboard-number" id="openCount">0</div>
                <div class="dashboard-label">Open Inspections</div>
            </button>

            <button class="dashboard-card" data-tone="orange" onclick="showQAReview()">
                <div class="dashboard-number" id="qaCount">0</div>
                <div class="dashboard-label">Awaiting QA</div>
            </button>

            <button class="dashboard-card" data-tone="green" onclick="showInspectionQueue('approved')">
                <div class="dashboard-number" id="approvedCount">0</div>
                <div class="dashboard-label">Approved</div>
            </button>

            <button class="dashboard-card" data-tone="red" onclick="showInspectionQueue('rejected')">
                <div class="dashboard-number" id="rejectedCount">0</div>
                <div class="dashboard-label">Rejected</div>
            </button>

            <button class="dashboard-card" data-tone="yellow" onclick="showInspectionQueue('pastDue')">
                <div class="dashboard-number" id="pastDueCount">0</div>
                <div class="dashboard-label">Past Due</div>
            </button>

            <button class="dashboard-card" data-tone="red" onclick="showInspectionQueue('failures')">
                <div class="dashboard-number" id="failureCount">0</div>
                <div class="dashboard-label">Total Failures</div>
            </button>

            <button class="dashboard-card" data-tone="teal" onclick="showInspectionQueue('all')">
                <div class="dashboard-number" id="onTimePercent">100%</div>
                <div class="dashboard-label">On-Time %</div>
            </button>

            <button class="dashboard-card" data-tone="violet" onclick="showInspectionQueue('all')">
                <div class="dashboard-number" id="inspectionCount">0</div>
                <div class="dashboard-label">Total Inspections</div>
            </button>

        </div>

        <div class="attention-section">
            <div class="section-heading">
                <div>
                    <h2>Needs Attention</h2>
                    <p>Past-due inspections and submitted work with failed findings.</p>
                </div>
                <button class="text-button" onclick="showInspectionQueue('attention')">View all</button>
            </div>
            <div id="attentionList" class="attention-list" aria-live="polite"></div>
        </div>

        <div class="menu-grid">
            <button class="menu-button" onclick="showInspection()">Start Inspection</button>
            <button class="menu-button" onclick="showInspectionQueue('open')">Open Inspections</button>
            <button class="menu-button" onclick="showQAReview()">QA Review</button>
            <button class="menu-button" onclick="showCompletedInspections()">Completed Inspections</button>
            <button class="menu-button" onclick="showReportCenter()">Generate Report Summary</button>
        </div>

    </div>

    <div id="inspectionPanel" class="hidden">
        <div class="inspection-card">

            <div class="inspection-header-row">
                <button class="back-button" onclick="backToHome()">← Back to Home</button>
                <h2>Inspection Entry</h2>
            </div>

            <label><strong>Select Inspection</strong></label>

            <select id="inspectionSelect">
                <option value="">Select Inspection</option>
            </select>

            <div id="inspectionInfo" class="inspection-info hidden"></div>
            <div id="checklistContainer" class="hidden"></div>

        </div>
    </div>

    <div id="openInspectionsPanel" class="hidden">
        <div class="inspection-card">

            <div class="inspection-header-row">
                <button class="back-button" onclick="backToHome()">← Back to Home</button>
                <h2 id="inspectionQueueTitle">Open Inspections</h2>
            </div>

            <div class="list-toolbar">
                <label class="search-field">
                    <span>Search inspections</span>
                    <input id="inspectionSearch" type="search" placeholder="Name, ID, department, or submitter">
                </label>
                <label>
                    <span>Sort by</span>
                    <select id="inspectionSort">
                        <option value="priority">Priority</option>
                        <option value="newest">Newest submitted</option>
                        <option value="oldest">Oldest submitted</option>
                        <option value="name">Inspection name</option>
                    </select>
                </label>
            </div>

            <p id="inspectionResultCount" class="result-count"></p>

            <div id="openInspectionList"></div>

        </div>
    </div>

    <div id="qaReviewPanel" class="hidden">
        <div class="inspection-card">

            <div class="inspection-header-row">
                <button class="back-button" onclick="backToHome()">← Back to Home</button>
                <h2>QA Review</h2>
            </div>

            <div id="qaReviewList"></div>

        </div>
    </div>

    <div id="completedInspectionsPanel" class="hidden">
        <div class="inspection-card">

            <div class="inspection-header-row">
                <button class="back-button" onclick="backToHome()">← Back to Home</button>
                <h2>Completed Inspections</h2>
            </div>

            <div id="completedInspectionList"></div>

        </div>
    </div>

    <div id="reportCenterPanel" class="hidden">
        <div class="inspection-card">

            <div class="inspection-header-row">
                <button class="back-button" onclick="backToHome()">← Back to Home</button>
                <h2>Report Center</h2>
            </div>

            <div class="report-filter-grid">

                <div>
                    <label><strong>Start Date</strong></label>
                    <input type="date" id="reportStartDate">
                </div>

                <div>
                    <label><strong>End Date</strong></label>
                    <input type="date" id="reportEndDate">
                </div>

                <div>
                    <label><strong>Department</strong></label>
                    <select id="reportDepartment">
                        <option value="All">All</option>
                    </select>
                </div>

                <div>
                    <label><strong>Inspection</strong></label>
                    <select id="reportInspection">
                        <option value="All">All</option>
                    </select>
                </div>

                <div>
                    <label><strong>Status</strong></label>
                    <select id="reportStatus">
                        <option value="All">All</option>
                        <option value="Awaiting QA">Awaiting QA</option>
                        <option value="Approved">Approved</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>

                <div>
                    <label><strong>Report Type</strong></label>
                    <select id="reportType">
                        <option value="Detailed">Detailed Audit Report</option>
                        <option value="Summary">Executive Summary</option>
                        <option value="Failed">Failed Findings Only</option>
                    </select>
                </div>

            </div>

            <div class="report-actions">
                <button class="detail-button" onclick="generateReport()">Generate Report</button>
                <button class="approve-button" onclick="printReport()">Print / Save as PDF</button>
                <button class="back-button" onclick="clearReport()">Clear Report</button>
            </div>

            <div id="reportOutput" class="report-output"></div>

        </div>
    </div>

    <div id="inspectionDetailsPanel" class="hidden">
        <div class="inspection-card">

            <div class="inspection-header-row">
                <button id="detailsBackButton" class="back-button">← Back</button>
                <h2>Inspection Details</h2>
            </div>

            <div id="inspectionDetailsContent"></div>

        </div>
    </div>

</main>

<script src="app.js"></script>

</body>
</html>
